name = "movi-app"
main = "worker.js"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "moviplayer.com", custom_domain = true },
  { pattern = "www.moviplayer.com", custom_domain = true }
]

# ─── /drive app (Google Drive video player) ───────────────────────────
# Public Google identifiers for the "Open with Movi Player" Drive app.
# These are NOT secret (a client_id and a GCP project number are public),
# so they live here and are injected into drive.html by buildDriveHtml().
# The Picker API key is a SECRET, set out-of-band and kept out of git:
#   echo "AIza..." | wrangler secret put DRIVE_API_KEY
# (The key is still visible in the served page — Picker runs client-side —
#  so it MUST be locked down with an HTTP-referrer restriction to
#  moviplayer.com/* in the Google Cloud console. Secrecy isn't the control.)
[vars]
DRIVE_CLIENT_ID = "1051579256106-k6kn9uavacv1g7rjj8805976t25131se.apps.googleusercontent.com"
DRIVE_APP_ID = "1051579256106"

# Hosts /proxy will refuse to relay, comma-separated. This is the lever the
# takedown process in the terms of service promises: add a host here and it
# stops resolving immediately, including for signatures already issued and
# for redirects that try to reach it. Subdomains are covered — "example.com"
# also blocks "cdn.example.com".
#
# Editable without a redeploy:
#   wrangler secret put PROXY_BLOCKED_HOSTS   (or edit here and deploy)
PROXY_BLOCKED_HOSTS = ""

# Turnstile site key — public, safe to commit. The worker substitutes it into
# the page at request time; the matching secret never lives here and goes in
# with `wrangler secret put TURNSTILE_SECRET_KEY`.
#
# Leaving this empty disables the bot gate everywhere it is used — the comments
# form, /api/token and /api/proxy-sign all fall open with a console warning.
# Set BOTH halves or neither: a secret without a site key leaves the server
# demanding a challenge the page has no way to solve.
#
# Local dev test key that always passes: 1x00000000000000000000AA
TURNSTILE_SITE_KEY = "0x4AAAAAAEU9gOLpQnS9mR0D"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "movi-assets"

# ─── Visitor feedback wall (/api/comments) ─────────────────────────────
# D1 backs the comment list under the FAQ on the landing page. Comments go
# live instantly — the abuse gate is server-side (profanity filter +
# Turnstile + per-IP rate limit in worker.js), not an approval queue.
#
# One-time setup (the create command prints the database_id to paste below):
#   wrangler d1 create movi-comments
#   wrangler d1 execute movi-comments --file=./schema.sql --remote
#
# OPTIONAL for forks: with no COMMENTS_DB binding the worker returns 503
# from /api/comments and the landing page hides the whole section, so the
# rest of the site works untouched.
#
# To take a comment down (soft delete), set an admin token:
#   wrangler secret put COMMENTS_ADMIN_TOKEN
# then: curl -X DELETE "https://moviplayer.com/api/comments?id=42" \
#         -H "Authorization: Bearer <token>"
[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "movi-comments"
database_id = "ea838cee-312d-46ea-b2f5-94efb870bcd3"   # replace with the id from `wrangler d1 create`

# Master HMAC secret for the URL-gated token proxy. Tokens embed the
# client's chosen upstream URL in a signed payload, so the worker needs
# this secret to verify incoming /api/video requests. Set with:
#   wrangler secret put ENC_SERVER_SECRET
# For local dev, add to .dev.vars instead (auto-loaded by wrangler dev).
#
# ─── Turnstile (OPTIONAL — skip entirely if you don't want bot protection) ─
# Cloudflare Turnstile gates /api/token to keep bots from draining your
# token quota. Completely optional for forks — leaving both vars unset
# makes the worker fall open with a warning log, and everything else
# works normally. Free tier covers unlimited requests, no plan upgrade
# needed.
#
# If you DO want it, set BOTH vars (partial setup breaks the flow —
# server enforces but client has no site key to solve the challenge):
#
#   wrangler secret put TURNSTILE_SECRET_KEY   # from Cloudflare dashboard
#   # TURNSTILE_SITE_KEY goes in the [vars] block at the top of this file
#
# Get keys: https://dash.cloudflare.com → Turnstile → Add site.
# Test keys for local dev (always pass, no network call):
#   site:   1x00000000000000000000AA
#   secret: 1x0000000000000000000000000000000AA

# Durable Object bindings — DISABLED on the free Workers plan. The
# worker.js code paths are fall-open safe: when NONCE_TRACKER is
# absent, nonce replay protection is skipped (a warning is logged);
# when WRAP_KEY_STORE is absent, the wrap key is derived
# deterministically from ENC_SERVER_SECRET instead of rotating hourly
# (so forward secrecy is lost). Core auth — HMAC signature, token
# HMAC + 30 s TTL, IP + fingerprint pinning, method + timestamp
# binding — remains intact on the free tier.
#
# To enable on the paid plan, uncomment the two bindings below plus
# the migrations block, then `wrangler deploy`.
#
# [[durable_objects.bindings]]
# name = "NONCE_TRACKER"
# class_name = "NonceTracker"
#
# [[durable_objects.bindings]]
# name = "WRAP_KEY_STORE"
# class_name = "WrapKeyStore"
#
# [[migrations]]
# tag = "v1"
# new_classes = ["NonceTracker", "WrapKeyStore"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.xml", "**/*.txt"]

# ─── Rate limits (manual setup in Cloudflare dashboard) ────────────────
# Workers doesn't expose per-route rate limiting in wrangler.toml — it
# has to be configured via the "Security → WAF → Rate limiting rules"
# dashboard on the moviplayer.com zone. Recommended rules:
#
#   1. Path: /api/session
#      Period: 1 minute     Threshold: 5 requests    Action: block 10 min
#      Characteristics: IP + User-Agent
#      Purpose: cap Turnstile solve attempts (one solve per session per hour)
#
#   2. Path: /api/token
#      Period: 1 minute     Threshold: 120 requests  Action: block 10 min
#      Characteristics: IP
#      Purpose: 30s token TTL × safety multiplier = ~2 refresh/min per tab
#
#   3. Path: /api/video
#      Period: 1 minute     Threshold: 60 requests   Action: managed_challenge
#      Characteristics: IP + token (URL arg)
#      Purpose: streaming fetches are long-lived; 60/min is >10× normal
#
#   4. Path: /proxy or /eproxy
#      Period: 1 minute     Threshold: 60 requests   Action: managed_challenge
#      Characteristics: IP
#      Purpose: general scraping cap
